version: '3.8'

services:
  # nginx web server
  web:
    image: nginx:alpine
    container_name: stream-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # Opened HTTPS port
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./generated/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      
  # ffmpeg and mediamtx
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: stream-mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./generated/mediamtx.yml:/mediamtx.yml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro 